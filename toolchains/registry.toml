# "Firmware Linux" (impactlinux.com/fwl) cross-compilers, uClibc 0.9.30 -- same
# toolchain era/major version as the powerpc-default-core recipe above, which
# is the only recipe in this catalog that has actually matched a real mirai3
# sample. That target's .init prologue used an old APCS frame-pointer
# convention (mov ip,sp / push {...,ip,lr,pc} / sub fp,ip,#4) that GCC stopped
# emitting by default well before any 2017.05+ Bootlin toolchain -- these
# vintage-2010ish objects are a much closer match for period-correct malware
# than another modern release would be. High priority: try these first.

