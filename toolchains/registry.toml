# Reviewed, pinned cross-toolchains. See src/fidb_poc/toolchain_registry.py.
#
# A row is "source-capable" once it carries toolchain_url/toolchain_sha256/
# cross_bin_prefix/cross_arch -- recipe_generator.py fans a recipe out across
# every matching row's family to build one cell per (recipe, toolchain).
# A row is "archive-capable" once it carries url/sha256/library_member --
# libc_catalog.py's mode="archive" path extracts a prebuilt libc.a straight
# out of it, no compile, no recipe needed. A row may be either or both.
#
# This is the full replacement for the old catalogs/default.toml: every
# archive-only row that file hand-duplicated per arch lives here now as a
# toolchain, not a recipe -- there's nothing to author per row beyond the
# pin itself. The one row that also backs an actual source build
# (powerpc-e500mc-bootlin-2017.05) is cross-referenced by name from
# recipes/libs/uclibc.toml's toolchain_variants.

[[toolchain]]
family = "uclibc"
version = "2017.05"
variant = "powerpc-e500mc-bootlin-2017.05"
machine = "PowerPC"
endianness = "big"
elf_class = 32
priority = 10
toolchain_url = "https://toolchains.bootlin.com/downloads/releases/toolchains/powerpc-e500mc/tarballs/powerpc-e500mc--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
toolchain_sha256 = "2eca639c6194147da52d3e3cbd9d3f0fafe23fe152200d4e720cb28ed963d980"
cross_bin_prefix = "bin/powerpc-buildroot-linux-uclibc-"
cross_arch = "powerpc"
kernel_headers_relpath = "powerpc-buildroot-linux-uclibc/sysroot/usr/include"

[[toolchain]]
family = "uclibc"
version = "0.9.30.1"
variant = "powerpc-default-core"
machine = "PowerPC"
endianness = "big"
elf_class = 32
priority = 10
url = "https://raw.githubusercontent.com/R00tS3c/DDOS-RootSec/master/uclib-cross-compilers/cross-compiler-powerpc.tar.bz2"
sha256 = "7e8ee376747d17a93a4a2707232ee8269f2a31779d25dbc07bc2b9477d81a1ac"
library_member = "cross-compiler-powerpc/lib/libc.a"
members_file = "uclibc-0.9.30.1-core.txt"

# The following are prebuilt libc.a objects already bundled in official Bootlin
# toolchain sysroots -- extracted with `ar x` only, nothing is compiled or
# executed. This trades exact-source-match confidence (they're uclibc-ng, not
# the older 0.9.30.1 built above) for broad, fast coverage: FID matching is
# fuzzy/hash-based, not exact-byte, so a close-version libc still scores well
# and these cover the bulk of arches actually seen in the mirai3 corpus.

