# fidb-recipe/v3, mode="source": authoring format for recipe_generator.py.
# Identity + source pin + build shape, expanded against
# toolchains/registry.toml into one cell per matching toolchain_variants
# entry -- see UNIFICATION_PLAN.md. This recipe's fields are ported
# unchanged from the old hand-written catalogs/default.toml
# "uclibc 0.9.30.1 powerpc-source-build" entry, now the only source of
# truth for that build (catalogs/default.toml no longer exists).
schema_version = "fidb-recipe/v3"
mode = "source"
name = "uclibc"
version = "0.9.30.1"
url = "https://uclibc.org/downloads/uClibc-0.9.30.1.tar.bz2"
sha256 = "2d9769a02c46cff73f56a076268192da1ce91c913e2e4e31c120be098f704c8c"
library_path = "lib/libc.a"
build_adapter = "uclibc_defconfig"
toolchain_family = "uclibc"
toolchain_variants = ["powerpc-e500mc-bootlin-2017.05"]
# A real compile beats a third-party prebuilt archive when both are
# available for the same target -- lower number, tried first by hunt.py's
# select_recipes (same priority the old hand-written catalog row used).
priority = 5

[patches]
"powerpc-e500mc-bootlin-2017.05" = ["../../toolchains/patches/uclibc-0.9.30.1-powerpc-crtn-size.patch"]
